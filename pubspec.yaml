name: db_infra
description: A command-line tool that help to automate your release workflow.
version: 0.5.3
homepage: https://github.com/db_infra


environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  archive: ">=4.0.0 <5.0.0"
  args: ">=2.7.0 <3.0.0"
  bdlogging: ">=1.2.0 <2.0.0"
  collection: ">=1.19.0 <2.0.0"
  encrypt: ">=5.0.3 <5.1.0"
  ftpconnect: ">=2.0.7 <2.1.0"
  gcloud: ">=0.8.19 <1.0.0"
  glob: '>=2.1.3 <3.0.0'
  googleapis_auth: ">=2.0.0 <2.1.0"
  http: '>=1.4.0 <2.0.0'
  io: ">=1.0.5 <2.0.0"
  jose: ">=0.3.4 <1.0.0"
  json_annotation: ">=4.9.0 <5.0.0"
  meta: '>=1.5.0 <2.0.0'
  path: '>=1.9.0 <2.0.0'

dev_dependencies:
  build_runner: any
  flutter_code_style: ^2.2.0
  json_serializable: ">=6.7.0 <7.0.0"
  test: ^1.25.9

executables:
  db_infra:
